const words = {"en": {"title": "Execution", "language": "Language / Idioma / 言語", "back": "Back to the tutorial", "first": "Start", "prev": "Previous", "next": "Next", "last": "Finish", "step": "Step", "of": "of", "all": "Show every step and its board", "line": "Instruction", "depth": "Function call depth", "state": "Turtle states", "eggs": "Eggs on the board", "direction": "Direction", "note": "Before = the instruction is about to run. After = a turtle action or check has just finished. Returning ends only one function call. Coordinates start at 0 in the top-left corner. An egg under a turtle is hidden by its picture but is still counted.", "nojs": "Enable JavaScript to navigate every recorded step.", "initial": "Initial board", "final": "Final board", "variables": "Variables", "output": "Output so far", "program": "Program instructions", "global": "Main program", "local": "Current function", "empty": "No variables yet", "emptyOutput": "No output yet"}, "es": {"title": "Ejecución", "language": "Idioma / Language / 言語", "back": "Volver al tutorial", "first": "Inicio", "prev": "Anterior", "next": "Siguiente", "last": "Final", "step": "Paso", "of": "de", "all": "Mostrar cada paso y su tablero", "line": "Instrucción", "depth": "Profundidad de llamadas", "state": "Estados de las tortugas", "eggs": "Huevos en el tablero", "direction": "Dirección", "note": "Antes = la instrucción está a punto de ejecutarse. Después = acaba de terminar una acción o comprobación. Volver termina solo una llamada. Las coordenadas empiezan en 0 en la esquina superior izquierda. La imagen de la tortuga oculta el huevo que tiene debajo, pero este sigue contando.", "nojs": "Activa JavaScript para recorrer todos los pasos registrados.", "initial": "Tablero inicial", "final": "Tablero final", "variables": "Variables", "output": "Salida hasta este paso", "program": "Instrucciones del programa", "global": "Programa principal", "local": "Función actual", "empty": "Todavía no hay variables", "emptyOutput": "Todavía no hay salida"}, "ja": {"title": "実行結果", "language": "言語 / Language / Idioma", "back": "教材に戻る", "first": "最初", "prev": "前へ", "next": "次へ", "last": "最後", "step": "ステップ", "of": "/", "all": "すべてのステップと盤面を表示", "line": "命令", "depth": "関数呼び出しの深さ", "state": "亀の状態", "eggs": "盤面の卵の数", "direction": "向き", "note": "「実行前」は次に実行する命令を、「実行後」は亀の動作や確認が終わったことを示します。「戻る」は1回の関数呼び出しだけを終えます。座標は左上の0から始まります。亀の下にある卵は絵では隠れますが、卵の数には含まれます。", "nojs": "すべてのステップを見るにはJavaScriptを有効にしてください。", "initial": "最初の盤面", "final": "最後の盤面", "variables": "変数", "output": "ここまでの出力", "program": "プログラムの命令", "global": "メインのプログラム", "local": "現在の関数", "empty": "まだ変数はありません", "emptyOutput": "まだ出力はありません"}};
const tiles = {" ": "board_empty_slot.png", "o": "egg.png", "#": "wall.png", "^": "turtule_up.png", "V": "turtule_down.png", "<": "turtule_left.png", ">": "turtule_right.png"};
let lang = new URLSearchParams(location.search).get('lang') || 'en';
if (!words[lang]) lang = 'en';
let index = 0;
const $ = id => document.getElementById(id);
const directions = {en:{'^':'up',V:'down','<':'left','>':'right'},es:{'^':'arriba',V:'abajo','<':'izquierda','>':'derecha'},ja:{'^':'上',V:'下','<':'左','>':'右'}};
function board(step) {
  const el = document.createElement('div'); el.className = 'board'; el.style.setProperty('--columns', run.width);
  el.setAttribute('role','img'); el.setAttribute('aria-label', words[lang].step + ' ' + (run.steps.indexOf(step)+1));
  for (const cell of step.cells) { const img = document.createElement('img'); img.src = '../img/' + tiles[cell]; img.alt = cell.trim() || '·'; el.append(img); }
  return el;
}
function stateText(step) {
  return words[lang].state + ':\n' + step.turtles.map(t => t.name + ': X=' + t.x + ', Y=' + t.y + ' · ' + words[lang].direction + ': ' + directions[lang][t.direction]).join('\n');
}
function variablesText(step) {
  return (step.variables || []).map(v=>words[lang][v.scope]+': '+v.name+' = '+JSON.stringify(v.value)).join('\n') || words[lang].empty;
}
function highlightInstruction(line) {
  for(const row of $('program-list').children) {
    if(Number(row.dataset.line) === line) row.setAttribute('aria-current','step');
    else row.removeAttribute('aria-current');
  }
  const active=$('program-list').querySelector('[aria-current="step"]');
  if(active) {
    const top=active.getBoundingClientRect().top-$('program-list').getBoundingClientRect().top;
    if(top<0 || top+active.offsetHeight>$('program-list').clientHeight) $('program-list').scrollTop+=top;
  }
}
function populateProgram() {
  $('program-panel').hidden=!run.instructions;
  $('program-list').replaceChildren();
  for(const instruction of run.instructions || []) {
    const row=document.createElement('li'); row.className='program-line'+(instruction.comment ? ' comment' : ''); row.dataset.line=instruction.number;
    row.style.paddingLeft=(8+instruction.depth*14)+'px';
    const number=document.createElement('span');number.className='number';number.textContent=String(instruction.number).padStart(4,'0');
    row.append(number,document.createTextNode(instruction.label[lang]));$('program-list').append(row);
  }
}
function show(value, updateHash = true) {
  index = Math.max(0, Math.min(run.steps.length - 1, Number(value) || 0));
  const step = run.steps[index], w = words[lang];
  $('step-range').value = index;
  $('progress').textContent = w.step + ' ' + (index + 1) + ' ' + w.of + ' ' + run.steps.length;
  $('step-title').textContent = step.label[lang];
  $('location').textContent = (step.line ? w.line + ' ' + String(step.line).padStart(4,'0') + ' · ' : '') + w.depth + ': ' + step.depth;
  const hasBoard=run.has_board !== false;
  $('current-board').hidden=$('state').hidden=$('egg-count').hidden=!hasBoard;
  $('snapshot-layout').classList.toggle('text-only',!hasBoard);
  if(hasBoard) $('current-board').replaceChildren(board(step)); $('state').textContent = stateText(step);
  $('egg-count').textContent = w.eggs + ': ' + step.eggs.length;
  $('variables-panel').hidden=!step.variables; $('variables').textContent=variablesText(step);
  $('output-panel').hidden=!step.output; $('text-output').textContent=step.output?.[lang] || w.emptyOutput;
  highlightInstruction(step.line);
  $('first').disabled = $('prev').disabled = index === 0;
  $('last').disabled = $('next').disabled = index === run.steps.length-1;
  if (updateHash) { try { history.replaceState(null,'', '?lang='+lang+'#step-'+index); } catch (_) {} }
}
function showAll() {
  $('all-steps').replaceChildren();
  if (!$('all').open) return;
  const fragment = document.createDocumentFragment();
  run.steps.forEach((step, i) => {
    const card = document.createElement('section'); card.className = 'card';
    const heading = document.createElement('h2'); heading.textContent = words[lang].step+' '+(i+1)+': '+step.label[lang];
    heading.style.fontSize='1.1rem';
    const location = document.createElement('p');
    location.textContent=(step.line ? words[lang].line+' '+String(step.line).padStart(4,'0')+' · ' : '')+words[lang].depth+': '+step.depth;
    const state = document.createElement('p'); state.className='state'; state.textContent=stateText(step)+'\n'+words[lang].eggs+': '+step.eggs.length;
    card.append(heading,location);
    if(run.has_board !== false) card.append(board(step),state);
    if(step.variables) { const variables=document.createElement('pre');variables.className='watch-values';variables.textContent=words[lang].variables+'\n'+variablesText(step);card.append(variables); }
    if(step.output) { const output=document.createElement('pre');output.className='text-output';output.textContent=words[lang].output+'\n'+(step.output[lang] || words[lang].emptyOutput);card.append(output); }
    fragment.append(card);
  });
  $('all-steps').append(fragment);
}
function translate() {
  const w=words[lang]; document.documentElement.lang=lang; $('language').value=lang;
  $('language-label').textContent=w.language; $('title').textContent=w.title+' · '+run.title[lang]; document.title=$('title').textContent;
  $('back').textContent=w.back; $('back').href=(run.tutorial || '../../TLAC_advanced_concepts.html')+'?lang='+lang+'#'+run.anchor+'-'+lang;
  $('note').textContent=run.note?.[lang] || w.note; $('all-label').textContent=run.all_label?.[lang] || w.all; $('range-label').textContent=w.step;
  $('variables-label').textContent=w.variables; $('output-label').textContent=w.output; $('program-label').textContent=w.program;
  for(const id of ['first','prev','next','last']) $(id).textContent=w[id];
  populateProgram();
  show(index); showAll();
}
$('language').addEventListener('change',()=>{lang=$('language').value;translate();});
$('step-range').max=run.steps.length-1; $('step-range').addEventListener('input',event=>show(event.target.value));
$('first').onclick=()=>show(0); $('prev').onclick=()=>show(index-1); $('next').onclick=()=>show(index+1); $('last').onclick=()=>show(run.steps.length-1);
$('all').addEventListener('toggle',showAll);
function fromHash() { const match=location.hash.match(/^#step-(\d+)$/); if(match) show(match[1],false); }
window.addEventListener('hashchange',fromHash); fromHash(); translate();
